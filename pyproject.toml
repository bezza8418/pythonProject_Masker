[project]
name = "pythonproject-masker"
version = "0.1.0"
description = ""
authors = [
    {name = "viktor bezuglov",email = "bezza8418@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.32.5,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "isort (>=7.0.0,<8.0.0)"
]

# зависимость pytest 11.02.2026
dev = [
    "pytest-cov (>=7.0.0,<8.0.0)"
]
[tool.poetry]
name = "my-project"
version = "0.1.0"
description = ""
package-mode = false  # Если не нужно собирать пакет

[tool.poetry.dependencies]
python = ">=3.14"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
black = ">=26.1.0,<27.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
